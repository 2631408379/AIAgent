spring:
  application:
    name: super-aii-agent
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    chat:
      options:
        model: qwen-plus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.dongyu.superaiiagent.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
